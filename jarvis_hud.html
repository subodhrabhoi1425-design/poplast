<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{--c:#3fd8ff;--o:#f5a623;--dim:color-mix(in srgb,var(--c) 40%,#000);--line:color-mix(in srgb,var(--c) 28%,transparent);--panel:#031521b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--c);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body{background:radial-gradient(circle at 50% 42%,#06283a 0,#020d15 58%,#000 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;background:linear-gradient(var(--c) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--c) 1px,transparent 1px) 0 0/48px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

#app{position:relative;display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(190px,240px) minmax(0,1fr) minmax(300px,390px);grid-template-areas:"left stage right";padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

/* ---------- left: clock + settings/account ---------- */
#left{grid-area:left;display:flex;flex-direction:column;justify-content:space-between;padding:26px 18px 18px;border-right:1px solid var(--line);background:linear-gradient(90deg,#00000066,transparent)}
#time{font-size:clamp(30px,3.2vw,44px);font-weight:300;letter-spacing:1px;line-height:1.05;color:#e9fbff;text-shadow:0 0 14px var(--c);white-space:nowrap}
#day{margin-top:10px;font-size:17px;letter-spacing:4px;text-transform:uppercase}
#date{margin-top:4px;font-size:13px;opacity:.75;letter-spacing:1px}
#sbtns{display:flex;flex-direction:column;gap:8px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;font-size:13px;letter-spacing:2px;text-transform:uppercase;text-align:left}
.sbtn:hover{border-color:var(--c);box-shadow:0 0 10px var(--line)}
.sbtn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#avatar{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--c);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:0}
#accName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:1px;text-transform:none;font-size:14px}

/* ---------- centre: the core ---------- */
#stage{grid-area:stage;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
#hud{width:min(100%,calc(100vh - 150px));height:auto;max-height:calc(100% - 78px);aspect-ratio:1;color:var(--c);cursor:pointer;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 40%,transparent))}
.ring{transform-origin:300px 300px;animation:spin var(--d,60s) linear infinite}
.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
body.listening .ring,body.speaking .ring{animation-duration:calc(var(--d)/4)}
body.listening #hud{filter:drop-shadow(0 0 18px var(--c))}
body.speaking #hud{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{filter:drop-shadow(0 0 28px var(--c)) brightness(1.25)}}
body.off #hud{filter:grayscale(1) opacity(.4)}

#micwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#mic{position:relative;width:54px;height:54px;border-radius:50%;background:var(--panel);border:1.5px solid var(--c);color:var(--c);display:grid;place-items:center}
#mic:hover{box-shadow:0 0 14px var(--line)}
#mic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mic.off{border-color:#ff6262;color:#ff7a7a}
#mic.off::after{content:"";position:absolute;width:36px;height:2px;background:currentColor;transform:rotate(-45deg)}
body.listening #mic{animation:micp 1.1s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 22%,transparent)}}
#miclbl{font-size:10px;letter-spacing:3px;opacity:.8}

/* ---------- right: conversation ---------- */
#right{grid-area:right;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:linear-gradient(270deg,#00000066,transparent)}
#rhead{padding:16px 18px 10px;font-size:12px;letter-spacing:4px;border-bottom:1px solid var(--line);opacity:.9}
#log{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.you{align-self:flex-end;align-items:flex-end}
.msg.jarvis{align-self:flex-start}
.bub{padding:9px 13px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:3px;color:#e6fbff}
.you .bub{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--dim)}
.jarvis .bub{background:var(--panel)}
.meta{margin-top:3px;font-size:11px;opacity:.55;letter-spacing:1px}
.typing .bub{letter-spacing:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#bar{display:flex;gap:8px;padding:12px 14px 16px;border-top:1px solid var(--line)}
#txt{flex:1;min-width:0;background:var(--panel);border:1px solid var(--dim);padding:11px 12px;border-radius:3px;outline:none;color:#e6fbff}
#txt:focus{border-color:var(--c);box-shadow:0 0 10px var(--line)}
.btn{background:var(--panel);border:1px solid var(--c);padding:0 14px;border-radius:3px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.btn:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}

/* ---------- settings / account dialogs ---------- */
#modal{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#000a;backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
.card{width:min(420px,92vw);max-height:90vh;overflow:auto;background:#04141f;border:1px solid var(--c);box-shadow:0 0 30px var(--line);padding:20px;border-radius:4px}
.card[hidden]{display:none}
.card h2{font-size:14px;letter-spacing:4px;font-weight:600;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row input[type=range]{width:150px;accent-color:var(--c)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--c)}
.row select,.card input[type=text]{background:#031521;border:1px solid var(--dim);padding:7px 9px;border-radius:3px;color:#e6fbff;outline:none}
.card input[type=text]{width:100%;margin:6px 0 8px}
.sw{display:flex;gap:8px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.sw button.sel{border-color:#fff}
.note{font-size:12px;opacity:.65;line-height:1.5;margin-bottom:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.acts .btn{height:36px}

/* ---------- phones / narrow windows ---------- */
@media (max-width:860px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,38vh) minmax(0,1fr);width:100vw;grid-template-areas:"left" "stage" "right"}
 #left{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;min-width:0;border-right:0;border-bottom:1px solid var(--line)}
 #time{font-size:26px}#day{margin-top:2px;font-size:12px;letter-spacing:3px}#date{margin-top:1px;font-size:11px}
 #sbtns{flex-direction:row}
 .sbtn{width:auto;padding:8px 10px}.sbtn .lbl,#accName{display:none}
 #stage{padding:4px;gap:4px}#hud{width:auto;height:calc(100% - 60px);max-height:none}#mic{width:40px;height:40px}#mic svg{width:20px;height:20px}#mic.off::after{width:28px}#miclbl{display:none}
 #right{border-left:0;border-top:1px solid var(--line);min-width:0}
 #bar{padding:10px 12px 14px}.btn{padding:0 10px}
}
</style>
</head>
<body class="idle">
<div id="app">
 <aside id="left">
  <div id="clock"><div id="time">--:--</div><div id="day"></div><div id="date"></div></div>
  <div id="sbtns">
   <button class="sbtn" id="btnSet" title="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg><span class="lbl">Settings</span></button>
   <button class="sbtn" id="btnAcc" title="Account"><span id="avatar">G</span><span class="lbl" id="accName">Guest</span></button>
  </div>
 </aside>

 <main id="stage">
  <svg id="hud" viewBox="0 0 600 600" aria-label="Jarvis core">
   <defs><clipPath id="wedge"><polygon points="300,300 300,-200 800,-200 800,700 300,700"/></clipPath></defs>
   <g class="ring" style="--d:90s"><circle cx="300" cy="300" r="286" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="330 14 90 14 520 14"/></g>
   <g class="ring rev" style="--d:70s" id="ticks"></g>
   <g class="ring" style="--d:55s">
    <circle cx="300" cy="300" r="205" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="46" stroke-dasharray="25 3"/>
    <g clip-path="url(#wedge)"><circle cx="300" cy="300" r="205" fill="none" stroke="currentColor" stroke-opacity=".6" stroke-width="46" stroke-dasharray="25 3"/></g>
    <circle cx="300" cy="300" r="231" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity=".8"/>
    <circle cx="300" cy="300" r="180" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity=".8"/>
   </g>
   <g class="ring rev" style="--d:35s;color:var(--o)">
    <circle cx="300" cy="300" r="164" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="150 880"/>
    <circle cx="300" cy="300" r="164" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".6" stroke-dasharray="3 7" stroke-dashoffset="40"/>
   </g>
   <g class="ring" style="--d:80s" id="ticks2"></g>
   <circle cx="300" cy="300" r="132" fill="#02111a" stroke="currentColor" stroke-width="1.5"/>
   <g class="ring rev" style="--d:120s">
    <circle cx="300" cy="300" r="112" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="10" stroke-dasharray="2 5"/>
    <circle cx="300" cy="300" r="92" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="14 6"/>
   </g>
   <text x="300" y="306" text-anchor="middle" font-size="36" font-weight="700" fill="#fff" textLength="204" lengthAdjust="spacingAndGlyphs" style="filter:drop-shadow(0 0 6px currentColor)">J.A.R.V.I.S.</text>
   <text id="status" x="300" y="340" text-anchor="middle" font-size="11" letter-spacing="3" fill="currentColor">TAP TO ACTIVATE</text>
  </svg>
  <div id="micwrap">
   <button id="mic" title="Microphone on / off" aria-label="Microphone on or off"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   <div id="miclbl">MIC ON</div>
  </div>
 </main>

 <section id="right">
  <div id="rhead">CONVERSATION</div>
  <div id="log" aria-live="polite"></div>
  <div id="bar">
   <input id="txt" type="text" placeholder="Type a command..." autocomplete="off">
   <button class="btn" id="btnSend">Send</button>
   <button class="btn" id="modeBtn" title="Switch between voice and text"></button>
  </div>
 </section>

 <div id="modal" hidden>
  <div class="card" id="pSet" hidden>
   <h2>SETTINGS</h2>
   <div class="row"><span>Speak replies aloud</span><input type="checkbox" id="sVoice"></div>
   <div class="row"><span>Speech speed</span><input type="range" id="sRate" min="0.7" max="1.4" step="0.05"></div>
   <div class="row"><span>Start in</span><select id="sStart"><option value="voice">Voice mode</option><option value="text">Text mode</option></select></div>
   <div class="row"><span>24-hour clock</span><input type="checkbox" id="sH24"></div>
   <div class="row"><span>Accent colour</span><div class="sw" id="sAccent"></div></div>
   <div class="acts"><button class="btn" id="sClear">Clear conversation</button><button class="btn" data-close>Done</button></div>
  </div>
  <div class="card" id="pAcc" hidden>
   <h2>ACCOUNT</h2>
   <label class="note" for="aName">Your name (Jarvis will use it to greet you)</label>
   <input type="text" id="aName" maxlength="30" placeholder="e.g. Tony">
   <p class="note">This is a local profile. It is saved only on this device, and nothing is sent to any server or cloud.</p>
   <div class="acts"><button class="btn" id="aReset">Reset profile</button><button class="btn" id="aSave">Save</button></div>
  </div>
 </div>
</div>

<script>
const TOKEN="__TOKEN__",SR=window.SpeechRecognition||window.webkitSpeechRecognition,$=id=>document.getElementById(id);
const ACC={cyan:["#3fd8ff","#f5a623"],green:["#4dffa6","#e8ff4d"],red:["#ff6262","#ffd24d"],violet:["#b794ff","#ff8cd6"]};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({voice:true,rate:1,start:"voice",accent:"cyan",h24:false,name:""},store.get("jarvis.cfg",{}));
let chat=store.get("jarvis.chat",[]);
let mode=cfg.start==="voice"&&SR?"voice":"text",on=false,busy=false,rec=null,micOn=true;
const saveCfg=()=>store.set("jarvis.cfg",cfg);

/* ---- ticks ---- */
(function(){let s="",t="";
 for(let i=0;i<120;i++){const a=i*Math.PI/60,L=i%5===0,r2=L?260:250;
  s+=`<line x1="${300+240*Math.cos(a)}" y1="${300+240*Math.sin(a)}" x2="${300+r2*Math.cos(a)}" y2="${300+r2*Math.sin(a)}" stroke="currentColor" stroke-width="${L?2.2:1}" stroke-opacity="${L?1:.55}"/>`}
 for(let k=0;k<4;k++){const a=(-100+k*7)*Math.PI/180;s+=`<circle cx="${300+233*Math.cos(a)}" cy="${300+233*Math.sin(a)}" r="2" fill="#f5d142"/>`}
 for(let i=0;i<72;i++){const a=i*Math.PI/36,L=i%6===0,r2=L?150:145;
  t+=`<line x1="${300+140*Math.cos(a)}" y1="${300+140*Math.sin(a)}" x2="${300+r2*Math.cos(a)}" y2="${300+r2*Math.sin(a)}" stroke="currentColor" stroke-width="${L?2:1}" stroke-opacity=".7"/>`}
 $("ticks").innerHTML=s;$("ticks2").innerHTML=t})();

/* ---- clock ---- */
function tick(){const d=new Date();
 $("time").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",hour12:!cfg.h24});
 $("day").textContent=d.toLocaleDateString([],{weekday:"long"});
 $("date").textContent=d.toLocaleDateString([],{day:"numeric",month:"long",year:"numeric"})}
tick();setInterval(tick,1000);

/* ---- appearance ---- */
function paint(){
 const [c,o]=ACC[cfg.accent]||ACC.cyan,st=document.documentElement.style;st.setProperty("--c",c);st.setProperty("--o",o);
 $("modeBtn").textContent=mode==="voice"?"Voice":"Text";
 $("mic").classList.toggle("off",!micOn);$("miclbl").textContent=micOn?"MIC ON":"MIC OFF";
 $("avatar").textContent=(cfg.name||"G").trim().charAt(0).toUpperCase();
 $("accName").textContent=cfg.name||"Guest";tick()}
function setState(s){document.body.className=s;$("status").textContent={idle:"STANDING BY",listening:"LISTENING",thinking:"PROCESSING",speaking:"RESPONDING",off:"OFFLINE"}[s]}

/* ---- conversation ---- */
const log=$("log");
function add(w,t,save=true,ts=Date.now(),cls=""){
 const m=document.createElement("div"),b=document.createElement("div"),s=document.createElement("div");
 m.className=`msg ${w} ${cls}`;b.className="bub";b.textContent=t;s.className="meta";
 s.textContent=(w==="you"?(cfg.name||"You"):"Jarvis")+" · "+new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
 m.append(b,s);log.appendChild(m);log.scrollTop=log.scrollHeight;
 if(save){chat.push({w,t,ts});chat=chat.slice(-200);store.set("jarvis.chat",chat)}return m}
chat.forEach(c=>add(c.w,c.t,false,c.ts));
if(!chat.length)add("jarvis","Tap the glowing core to activate me, or just start typing.",false);

/* ---- speech ---- */
function pickVoice(){const v=speechSynthesis.getVoices();
 return v.find(x=>/en-GB/i.test(x.lang)&&/male|daniel|george|ryan/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))}
function say(t){return new Promise(res=>{
 if(!cfg.voice||!("speechSynthesis"in window)){res();return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=pickVoice();
 if(v)u.voice=v;u.pitch=.9;u.rate=cfg.rate;u.onend=u.onerror=res;setState("speaking");speechSynthesis.speak(u)})}
function setMode(m){
 if(m==="voice"&&!SR){add("jarvis","This browser has no speech recognition. Use Chrome or Edge for voice mode.",false);m="text"}
 mode=m;paint();if(m==="voice"){if(on)next()}else if(rec)rec.abort()}
function next(){if(on&&micOn&&mode==="voice"&&!busy&&!rec)listen()}
function listen(){
 rec=new SR();rec.lang="en-US";rec.interimResults=false;let got=false;
 rec.onresult=e=>{got=true;send(e.results[0][0].transcript)};
 rec.onerror=e=>{if(["not-allowed","service-not-allowed","network"].includes(e.error)){
  add("jarvis",e.error==="network"?"The speech service can't be reached. Switching to text mode.":"Microphone access was denied. Switching to text mode.",false);setMode("text")}};
 rec.onend=()=>{rec=null;if(!got&&on&&micOn&&mode==="voice"&&!busy)setTimeout(next,300)};
 try{rec.start();setState("listening")}catch(e){rec=null}}

/* ---- talking to the Jarvis core ---- */
async function send(text){
 text=text.trim();if(!text||busy)return;
 on=true;busy=true;add("you",text);setState("thinking");const typing=add("jarvis","...",false,Date.now(),"typing");let r;
 try{r=await(await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json","X-Token":TOKEN},body:JSON.stringify({text,mode,name:cfg.name})})).json()}
 catch(e){typing.remove();add("jarvis","I've lost contact with my core. Is it still running?",false);busy=false;setState("off");return}
 typing.remove();
 if(r.mode&&r.mode!==mode){mode=r.mode;paint()}
 for(const m of r.replies){add("jarvis",m.text);if(r.speak)await say(m.spoken)}
 busy=false;
 if(r.exit){on=false;setState("off");setTimeout(()=>window.close(),2500);return}
 setState("idle");next()}

function activate(){
 if(!on){on=true;const h=new Date().getHours(),g=h<12?"morning":h<18?"afternoon":"evening",
  t=`Good ${g}${cfg.name?", "+cfg.name:""}. Jarvis online and fully operational. How may I help?`;add("jarvis",t);
  (mode==="voice"?say(t):Promise.resolve()).then(()=>{setState("idle");next()})}
 else if(mode==="voice"&&!busy&&!rec){micOn=true;paint();listen()}}

/* ---- controls ---- */
$("hud").onclick=activate;
$("btnSend").onclick=()=>{const v=$("txt").value;$("txt").value="";if(rec)rec.abort();send(v)};
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")$("btnSend").click()});
$("mic").onclick=()=>{
 micOn=!micOn;
 if(!micOn){if(rec)rec.abort();if(document.body.className==="listening")setState("idle")}
 else{if(mode!=="voice")setMode("voice");if(!on)activate();else next()}
 paint()};
$("modeBtn").onclick=()=>setMode(mode==="voice"?"text":"voice");

/* ---- dialogs ---- */
const open=id=>{$("modal").hidden=false;$("pSet").hidden=id!=="pSet";$("pAcc").hidden=id!=="pAcc"};
const closeModal=()=>{$("modal").hidden=true};
$("modal").onclick=e=>{if(e.target.id==="modal"||e.target.hasAttribute("data-close"))closeModal()};
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("btnSet").onclick=()=>{$("sVoice").checked=cfg.voice;$("sRate").value=cfg.rate;$("sStart").value=cfg.start;$("sH24").checked=cfg.h24;mark();open("pSet")};
$("btnAcc").onclick=()=>{$("aName").value=cfg.name;open("pAcc")};
const sw=$("sAccent");
Object.keys(ACC).forEach(k=>{const b=document.createElement("button");b.style.background=ACC[k][0];b.title=k;b.dataset.k=k;
 b.onclick=()=>{cfg.accent=k;saveCfg();paint();mark()};sw.appendChild(b)});
function mark(){[...sw.children].forEach(b=>b.classList.toggle("sel",b.dataset.k===cfg.accent))}
$("sVoice").onchange=e=>{cfg.voice=e.target.checked;saveCfg()};
$("sRate").oninput=e=>{cfg.rate=+e.target.value;saveCfg()};
$("sStart").onchange=e=>{cfg.start=e.target.value;saveCfg()};
$("sH24").onchange=e=>{cfg.h24=e.target.checked;saveCfg();tick()};
$("sClear").onclick=()=>{chat=[];store.set("jarvis.chat",[]);log.innerHTML="";add("jarvis","Conversation cleared.",false)};
$("aSave").onclick=()=>{cfg.name=$("aName").value.trim().slice(0,30);saveCfg();paint();closeModal();add("jarvis",cfg.name?`Pleased to meet you, ${cfg.name}.`:"Profile saved.")};
$("aReset").onclick=()=>{cfg=Object.assign({},{voice:true,rate:1,start:"voice",accent:"cyan",h24:false,name:""});saveCfg();paint();closeModal()};

/* ---- keep-alive so the app closes with its window ---- */
const ping=()=>fetch("/api/ping",{method:"POST",headers:{"X-Token":TOKEN}}).catch(()=>{});
ping();setInterval(ping,5000);
addEventListener("pagehide",()=>{try{speechSynthesis.cancel();if(rec)rec.abort()}catch(e){}navigator.sendBeacon("/api/bye?t="+TOKEN)});
paint();
</script>
</body>
</html>
